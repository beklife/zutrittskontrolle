name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (mvn verify inkl. Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Docker is preinstalled on ubuntu-latest, so Testcontainers can start PostgreSQL.
      - run: ./mvnw -B verify

  frontend:
    name: Frontend (Lint + Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  e2e:
    name: E2E (Playwright + axe)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: zutritt
          POSTGRES_USER: zutritt
          POSTGRES_PASSWORD: zutritt
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U zutritt -d zutritt"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Backend bauen und starten
        working-directory: backend
        run: |
          ./mvnw -B -q package -DskipTests
          nohup java -jar target/zutritt-backend-*.jar > backend.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:8080/actuator/health && exit 0
            sleep 2
          done
          cat backend.log
          exit 1

      - name: Playwright installieren
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: E2E-Tests
        working-directory: frontend
        run: npx playwright test

      - name: Playwright-Report hochladen
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
